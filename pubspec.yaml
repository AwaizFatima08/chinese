name: lingodaily
description: "Lingo15 - learn Chinese (HSK 1-6) and German (A1-C2) by listening, speaking, reading and writing in 15 minutes a day. Built to host more languages."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  flutter_riverpod: any
  go_router: any
  sqflite: any
  path: ^1.9.1
  shared_preferences: any
  clock: ^1.1.2

  flutter_tts: any
  speech_to_text: any
  path_drawing: any
  google_mobile_ads: any
  url_launcher: any
  package_info_plus: any
  android_intent_plus: any
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  google_sign_in: ^7.2.0
  record: ^6.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  sqflite_common_ffi: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/content/languages.json
    - assets/content/zh/pack.json
    - assets/content/zh/vocab.json
    - assets/content/zh/sentences.json
    - assets/content/zh/grammar.json
    - assets/content/zh/levels/
    - assets/content/zh/strokes/
    - assets/content/de/pack.json
    - assets/content/de/vocab.json
    - assets/content/de/sentences.json
    - assets/content/de/grammar.json
    - assets/content/de/levels/
    - assets/speak/
    - assets/licenses/
